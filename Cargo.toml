[workspace]
resolver = "2"
members = [
    "crates/common",
    "crates/db",
    "crates/network-monitor",
    "crates/session-builder",
    "crates/categorization",
    "crates/analytics",
    "crates/agent",
    "crates/api",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
authors = ["NetChronicle Contributors"]

[workspace.dependencies]
anyhow = "1"
async-trait = "0.1"
chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.8", features = ["runtime-tokio", "postgres", "chrono", "uuid", "migrate"] }
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["serde", "v4"] }
axum = "0.8"
tower = "0.5"
tower-http = { version = "0.6", features = ["cors", "trace"] }

netchronicle-common = { path = "crates/common" }
netchronicle-db = { path = "crates/db" }
netchronicle-network-monitor = { path = "crates/network-monitor" }
netchronicle-session-builder = { path = "crates/session-builder" }
netchronicle-categorization = { path = "crates/categorization" }
netchronicle-analytics = { path = "crates/analytics" }
netchronicle-agent = { path = "crates/agent" }
