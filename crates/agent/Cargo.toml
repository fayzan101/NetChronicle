[package]
name = "netchronicle-agent"
description = "Background data collector (apps, sites, network)"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[[bin]]
name = "netchronicle-agent"
path = "src/main.rs"

[dependencies]
anyhow = { workspace = true }
axum = { workspace = true }
chrono = { workspace = true }
dotenvy = { workspace = true }
regex = "1"
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
uuid = { workspace = true }
x-win = "5"

netchronicle-categorization = { workspace = true }
netchronicle-common = { workspace = true }
netchronicle-db = { workspace = true }
netchronicle-network-monitor = { workspace = true }
netchronicle-session-builder = { workspace = true }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = ["Win32_UI_Input_KeyboardAndMouse", "Win32_System_SystemInformation"] }
