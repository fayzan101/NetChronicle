services:
  postgres:
    image: postgres:16-alpine
    container_name: netchronicle-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: netchronicle
      POSTGRES_PASSWORD: netchronicle
      POSTGRES_DB: netchronicle
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U netchronicle -d netchronicle"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
